name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/make_web_audio.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Web recordings (not in git): build the 42 MP3s from the example pack of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --pattern 'Choir_Practice_All_My_Ducklings.zip' --dir "$RUNNER_TEMP"
          python site/make_web_audio.py "$RUNNER_TEMP/Choir_Practice_All_My_Ducklings.zip" --out docs/audio
          test "$(ls docs/audio/*.mp3 | wc -l)" = 42
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
